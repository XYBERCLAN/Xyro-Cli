name: CI on main (merge)

# Runs the full quality gate whenever the default branch is updated, so main
# stays in a shippable state. ci.yml already runs on push+PR to main; keeping
# a dedicated gate on main (via merge / fast-forward) makes the intent explicit
# and guarantees the branch is always green even for direct pushes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate on main
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests + coverage gate
        run: npm run test:coverage:ci
