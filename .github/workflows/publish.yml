name: Publish to npm (tag push)

# Fallback path for releases cut locally: `npm version <bump> && git push --follow-tags`.
# The Release workflow (release.yml) is the recommended one-click path; tags it
# pushes do not re-trigger this workflow (GITHUB_TOKEN events never do).
#
# Recovery: if a release was versioned and tagged but npm refused it (e.g. a
# bad NPM_TOKEN), fix the secret and run this workflow by hand
# (Actions → Publish to npm → Run workflow, or `gh workflow run publish.yml`).
# It publishes the version in package.json only if npm doesn't have it yet.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          # Manual runs publish whatever package.json says; tag pushes must match it
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG_VERSION="$PKG_VERSION"; else TAG_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          if [[ "$PKG_VERSION" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi
          # Idempotent: skip if this exact version is already on npm
          if npm view "xyro-cli@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Publish
        if: steps.meta.outputs.published != 'true'
        run: npm publish --provenance --access public --tag ${{ steps.meta.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.meta.outputs.published != 'true'
        run: |
          FLAGS="--generate-notes"
          if [ "${{ steps.meta.outputs.tag }}" = "next" ]; then FLAGS="$FLAGS --prerelease"; fi
          TAG="v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "XYRO $TAG" $FLAGS
        env:
          GH_TOKEN: ${{ github.token }}
