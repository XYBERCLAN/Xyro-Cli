name: Auto release

# Every push to main that brings something users would notice is published
# to npm automatically — no button to press:
#   feat: → minor · fix:/perf:/revert: → patch · breaking (type!: / BREAKING CHANGE) → major
#   docs/chore/test/ci/refactor only → nothing is published
#   put [release] in a commit message to force a patch, [skip release] to skip
#   a version that was tagged but never reached npm is published on the next run
# Users on any older XYRO see a pop-up on their next launch and can /update.
#
# Needs the NPM_TOKEN repository secret (an npm automation token). If main is
# branch-protected, allow github-actions[bot] to push the version commit.

on:
  push:
    branches: [main]

permissions:
  contents: write # version commit, tag and GitHub Release
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Decide, test, publish
    # Our own version commits must not trigger another release
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Decide the version bump from the commits
        id: bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Catch-up: a version that was tagged but never reached npm (say, a bad token) is published first,
          # unless it is only waiting for approval in npm's staging area (then the next version is released)
          if [ "$VERSION" != "0.0.0" ] && ! npm view "xyro-cli@$VERSION" version >/dev/null 2>&1 && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if npx -y npm@12 stage list xyro-cli 2>/dev/null | grep -q "$VERSION"; then
              echo "v$VERSION is staged and waiting for approval: releasing the next version instead"
            else
              echo "bump=catchup" >> "$GITHUB_OUTPUT"
              echo "Publishing v$VERSION, which was versioned but never published"
              exit 0
            fi
          fi
          BUMP=$(node scripts/release-bump.mjs)
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Release type: $BUMP"

      - name: Nothing to release
        if: steps.bump.outputs.bump == 'none'
        run: echo "Only docs/chore/test/ci changes since the last release, so nothing to publish."

      - name: Check the npm token
        if: steps.bump.outputs.bump != 'none'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: publishing with npm Trusted Publishing (set it up on npmjs.com → xyro-cli → Settings → Trusted publishing)."
          fi

      - name: Install dependencies
        if: steps.bump.outputs.bump != 'none'
        run: npm ci

      - name: Typecheck
        if: steps.bump.outputs.bump != 'none'
        run: npm run lint

      - name: Build
        if: steps.bump.outputs.bump != 'none'
        run: npm run build

      - name: Tests
        if: steps.bump.outputs.bump != 'none'
        run: npm test

      - name: Bump version (commit + tag)
        if: steps.bump.outputs.bump != 'none' && steps.bump.outputs.bump != 'catchup'
        id: bump_version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$BUMP" in patch|minor|major) ;; *) echo "::error::invalid bump: $BUMP"; exit 1 ;; esac
          npm version "$BUMP" -m "chore(release): v%s"

      - name: Version to publish
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rebuild with the new version
        if: steps.bump.outputs.bump != 'none' && steps.bump.outputs.bump != 'catchup'
        run: npm run build

      - name: Push version commit and tag
        if: steps.bump.outputs.bump != 'none' && steps.bump.outputs.bump != 'catchup'
        run: git push --follow-tags origin HEAD:${{ github.ref_name }}

      - name: Publish to npm
        if: steps.bump.outputs.bump != 'none'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: latest
        run: |
          # Tokens that require staged publishing (npm's 2FA-safe flow) are refused by a direct
          # publish: stage the release instead and let a human approve it on npmjs.com
          # npm 12: uses Trusted Publishing (GitHub OIDC, no token) when it is enabled for this
          # repository on npmjs.com, and falls back to NPM_TOKEN otherwise
          if npx -y npm@12 publish --provenance --access public --tag "$TAG" 2> publish.err; then exit 0; fi
          cat publish.err
          # Already published (e.g. approved on npmjs.com while this run started): nothing left to do
          if grep -q "cannot publish over the previously published" publish.err; then
            echo "::notice::This version is already on npm."
            exit 0
          fi
          if grep -q "E_STAGE_REQUIRED" publish.err; then
            if ! npx -y npm@12 stage publish . --provenance --access public --tag "$TAG" 2> stage.err; then
              cat stage.err
              # Already staged or published: nothing new to do for this version
              if grep -q "Cannot stage previously published" stage.err; then echo "::notice::This version is already staged or published."; exit 0; fi
              exit 1
            fi
            VERSION=$(node -p "require('./package.json').version")
            echo "::notice title=Approve the release::xyro-cli v$VERSION is staged. Approve it on npmjs.com (your package → Staged), or run: npm stage list xyro-cli, then npm stage approve <id>"
            exit 0
          fi
          exit 1

      - name: Create GitHub Release
        if: steps.bump.outputs.bump != 'none'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "XYRO $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
